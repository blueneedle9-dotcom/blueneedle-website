<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <rect width="400" height="300" fill="#f8f9ff"/>
  <rect x="20" y="20" width="360" height="260" rx="12" fill="#eff4ff" stroke="#dce9ff" stroke-width="1.5"/>
  <g transform="translate(140, 75)" stroke="#0f3d6c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Surgical Forceps Schematic Icon -->
    <path d="M30 10 L50 70 L50 110" />
    <path d="M90 10 L70 70 L70 110" />
    <!-- Pivot Box Joint -->
    <circle cx="60" cy="70" r="7" fill="#006877" stroke="#00274c" stroke-width="2"/>
    <!-- Serrations -->
    <line x1="37" y1="25" x2="43" y2="25" stroke="#737780" stroke-width="1.5"/>
    <line x1="40" y1="35" x2="47" y2="35" stroke="#737780" stroke-width="1.5"/>
    <line x1="43" y1="45" x2="51" y2="45" stroke="#737780" stroke-width="1.5"/>
    <line x1="77" y1="25" x2="83" y2="25" stroke="#737780" stroke-width="1.5"/>
    <line x1="73" y1="35" x2="80" y2="35" stroke="#737780" stroke-width="1.5"/>
    <line x1="69" y1="45" x2="77" y2="45" stroke="#737780" stroke-width="1.5"/>
    <!-- Finger Rings -->
    <circle cx="40" cy="130" r="14" fill="#ffffff" stroke="#0f3d6c" stroke-width="3"/>
    <circle cx="80" cy="130" r="14" fill="#ffffff" stroke="#0f3d6c" stroke-width="3"/>
    <!-- Ratchet lock -->
    <path d="M48 115 L72 115" stroke="#737780" stroke-width="2" stroke-dasharray="2 2"/>
  </g>
  <text x="200" y="245" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="600" fill="#0f3d6c" letter-spacing="0.5">BULE NEEDLE SPECIFICATION</text>
  <text x="200" y="262" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#737780">DIN EN ISO 7153-1 • AISI 420/440</text>
</svg>
